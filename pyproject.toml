[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cf-allowlist-updater"
version = "1.0.0"
description = "Dockerized updater for a Cloudflare Access policy from the container's current public IP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Saturn/Mercury" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cf-allowlist-updater = "cf_allowlist_updater.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
